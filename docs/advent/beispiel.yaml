# Beispiel für app:advent:import (src/Tool/Advent/Command/ImportAdventCommand.php).
# Aufruf: php bin/console app:advent:import docs/advent/beispiel.yaml [--dry-run]
# Gleicher Titel + Jahr = derselbe Kalender (wird aktualisiert). Felder:
#   start      Tag, an dem Tür 1 aufgeht (0 Uhr in timezone); Tür n einen Tag später je Nummer
#   host       optional eigene Domain (DNS + Caddy nötig)
#   doors      number, question, image (Pfad im Medienordner, z. B. advent/tuer-05.jpg), points,
#              choices: text, correct (genau eine true), response, image, video (YouTube-Link)
#   participants  Namen; jeder bekommt einen persönlichen Link (wird am Ende ausgegeben)
title: Beispiel-Adventskalender
year: 2026
start: '2026-12-01'
timezone: Europe/Berlin
intro: Jeden Tag eine Frage – sammle Punkte für die Gewinne unten.
win_stages:
- min_points: 0
  label: 0–4 Punkte
  prize: Eine Woche PS5-Leihe
- min_points: 5
  label: 5–12 Punkte
  prize: Ein eigener Tesa-Abroller
- min_points: 13
  label: 13–18 Punkte
  prize: Sushi-Abend
- min_points: 19
  label: ab 19 Punkten
  prize: Ein Wunsch frei beim Entwickler
participants:
- Testperson
