; Fotos in EasyAdmin (Fotokalender, Adventskalender, Startseite): je Datei 20 MB (wie IMGPROXY_MAX_SRC_FILE_SIZE),
; mehrere auf einmal bis 100 MB. Caddy nimmt bis 104 MB an (docker/caddy/Caddyfile).
upload_max_filesize = 20M
post_max_size = 100M
max_file_uploads = 50
memory_limit = 256M
; Gemini-Anfragen (BetAI) können dauern.
max_execution_time = 120
expose_php = Off
realpath_cache_size = 4096K
realpath_cache_ttl = 600
opcache.enable = 1
opcache.memory_consumption = 128
opcache.max_accelerated_files = 20000
date.timezone = Europe/Berlin
