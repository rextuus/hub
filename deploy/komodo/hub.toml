# Hub – Komodo-Ressourcen (Resource Sync). Feldnamen geprüft gegen komodo_client 2.3 (docs.rs: StackConfig,
# ProcedureConfig, RunStackService) und komo.do/docs/automate/sync-resources; Aufbau wie bei Wedora (v2.3.3).
#
# Einbinden: Komodo → Syncs → New Resource Sync, Quelle = dieses Repo, Resource Path = deploy/komodo/hub.toml.
# Hier stehen keine Secrets. Alles in doppelten eckigen Klammern sind Komodo-Secrets (Settings → Variables,
# Häkchen „Secret“); die Liste steht in .env.prod.dist und docs/deployment.md. Nicht geheime Werte stehen direkt hier.
# Achtung: Komodo ersetzt eine unbekannte Variable nicht und meldet auch keinen Fehler. Deshalb prüft
# pre-deploy.sh die geschriebene .env.prod.local und bricht ab, wenn noch ein Platzhalter darin steht.

[[stack]]
name = "hub"
description = "Sammlung kleiner Tools, die eine gemeinsame User-Anmeldung und DB bieten"
tags = ["hub", "projekt"]
# Ein Sync legt den Stack nur an bzw. gleicht ihn an. Deployt wird bewusst von Hand („Deploy“).
deploy = false

[stack.config]
# Name des Servers in Komodo (Servers-Liste), nicht der Hostname.
server = "abyss"
# Quick-Links im Kopf des Stacks
links = [
  "https://wh-company.com",
  "https://wh-company.com/admin",
  "https://github.com/rextuus/hub",
  "http://localhost:9121/projekte/#hub",
]

# Quelle: GitHub-Repo. git_account = Benutzername eines unter Settings → Providers für github.com
# hinterlegten Accounts mit Token (das Token muss rextuus/hub lesen dürfen).
git_provider = "github.com"
git_https = true
git_account = "rextuus"
repo = "rextuus/hub"
branch = "main"
# Leer = neuester Commit von branch. Für einen Rollback hier einen Commit-Hash eintragen und deployen.
commit = ""
# Nicht neu klonen; Daten liegen ohnehin außerhalb (Named Volumes hub_*, BACKUP_DIR).
reclone = false

# Ergibt: docker compose -p hub -f compose.prod.yaml --env-file .env.prod.local …
# project_name MUSS „hub“ bleiben; die Volumes sind zusätzlich per name: in compose.prod.yaml festgenagelt.
file_paths = ["compose.prod.yaml"]
project_name = "hub"
env_file_path = ".env.prod.local"

# Wird bei jedem Deploy nach .env.prod.local geschrieben (KEY=wert, Rechte 600).
# Kommentare in diesem Block landen ebenfalls in der Datei: dort nie Platzhalter erwähnen.
environment = """
# Öffentliche Adresse (Links in Konsolenbefehlen); TLS macht der Caddy auf dem VPS
DEFAULT_URI = https://wh-company.com

# Secrets
APP_SECRET = [[HUB_APP_SECRET]]
MYSQL_PASSWORD = [[HUB_MYSQL_PASSWORD]]
MYSQL_ROOT_PASSWORD = [[HUB_MYSQL_ROOT_PASSWORD]]
GEMINI_API_KEY = [[HUB_GEMINI_API_KEY]]
SENTRY_DSN = [[HUB_SENTRY_DSN]]
IMGPROXY_KEY = [[HUB_IMGPROXY_KEY]]
IMGPROXY_SALT = [[HUB_IMGPROXY_SALT]]
MAILER_DSN = [[HUB_MAILER_DSN]]

# Datenbank (nicht ändern, sonst passt es nicht mehr zum bestehenden Volume)
MYSQL_DATABASE = hub
MYSQL_USER = hub

# Eingang: Caddy auf dem VPS (10.0.0.1), WireGuard, abyss 10.0.0.2:8197
HTTP_BIND = 10.0.0.2
HTTP_PORT = 8197
REVERSE_PROXY_IPS = 10.0.0.1

# Sicherungen (Host-Pfad, einmalig anlegen) und wie viele Dumps je Anlass bleiben
BACKUP_DIR = /srv/hub/backups
BACKUP_KEEP = 14
"""

# Images für app/migrate/web werden auf dem Server gebaut (docker compose build vor up).
run_build = true
# Kein „compose pull“ vor jedem Deploy: mysql ist auf eine feste Version gepinnt, up holt fehlende Images selbst.
auto_pull = false
destroy_before_deploy = false

# Ergibt: docker compose … up -d --wait --wait-timeout 300 – Erfolg erst, wenn alle Dienste „healthy“ sind.
extra_args = ["--wait", "--wait-timeout", "300"]

# migrate läuft bei jedem Deploy einmal und beendet sich, backup läuft nur auf Abruf.
ignore_services = ["migrate", "backup"]

# Vor dem Bauen: Datenbank sichern (läuft im Periphery-Container im Stack-Ordner; Exit ≠ 0 bricht ab).
pre_deploy.path = "."
pre_deploy.command = "sh deploy/komodo/pre-deploy.sh"

# Nach erfolgreichem up: Zustand ins Deploy-Log, alte Hub-Images aufräumen.
post_deploy.path = "."
post_deploy.command = "sh deploy/komodo/post-deploy.sh"

# Kein automatisches Deploy bei Push oder neuen Images – deployt wird bewusst.
webhook_enabled = false
poll_for_updates = false
auto_update = false
send_alerts = true

# ---------------------------------------------------------------------------------------------------------
# Tägliche Datenbanksicherung: `docker compose run --rm --no-TTY --no-deps backup daily` im Stack
# (hub-db-<zeit>-daily.sql.gz in /srv/hub/backups, 14 bleiben liegen). Komodo macht vorher ein `git pull` im
# Stack-Ordner (deployt aber nichts). no_deps: ein noch nicht deployter Commit mit geändertem database-Dienst
# würde die Datenbank sonst nebenbei neu erstellen. Läuft der Stack nicht, scheitert der Dump absichtlich, und
# Komodo alarmiert (failure_alert). Die Team-Logos sichert die Offsite-Sicherung direkt aus dem Volume.

[[procedure]]
name = "hub-backup"
description = "Hub: täglicher Datenbank-Dump nach /srv/hub/backups (Rotation: BACKUP_KEEP)"
tags = ["hub", "projekt"]

[procedure.config]
schedule_format = "English"
schedule = "Every day at 02:15"
schedule_timezone = "Europe/Berlin"
schedule_enabled = true
schedule_alert = false
failure_alert = true

[[procedure.config.stage]]
name = "Datenbank sichern"
executions = [
  { execution.type = "RunStackService", execution.params = { stack = "hub", service = "backup", command = ["daily"], no_tty = true, no_deps = true } },
]
