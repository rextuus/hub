# Hub – Produktion auf einem einzelnen Server (abyss, Komodo-Stack hub).
# Aufruf (Komodo macht genau das):
#   docker compose -p hub -f compose.prod.yaml --env-file .env.prod.local up -d --build --wait
# Reihenfolge beim Start: database (gesund) → migrate (Migrationen, einmalig) → app → web.
# Secrets kommen ausschließlich aus .env.prod.local (Vorlage: .env.prod.dist; Komodo schreibt die Datei bei jedem
# Deploy aus den im UI hinterlegten Variablen). Ablauf: docs/deployment.md.
# Die Entwicklungsumgebung (compose.yaml, compose.override.yaml) ist davon unabhängig.
name: hub

# Docker-Logs begrenzen (sonst wachsen sie unbegrenzt): je Dienst höchstens 5 × 10 MB.
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

x-app: &app
  build:
    context: .
    dockerfile: docker/php/Dockerfile
    target: prod
  image: hub-app:prod
  # Selbst gebaut, nie aus einer Registry: `docker compose pull` (Komodo „Pull Images“) überspringt den Dienst.
  pull_policy: build
  restart: unless-stopped
  logging: *logging
  volumes:
    # Team-Logos (BetAI): in der DB als /assets/bet_ai/logos/… hinterlegt, eingelesen mit app:bet-ai:import-logos.
    - media_data:/srv/app/public/assets/bet_ai/logos:rw
  environment:
    APP_ENV: prod
    APP_SECRET: ${APP_SECRET:?APP_SECRET fehlt in .env.prod.local}
    DEFAULT_URI: ${DEFAULT_URI:?DEFAULT_URI fehlt in .env.prod.local}
    DATABASE_URL: mysql://${MYSQL_USER:-hub}:${MYSQL_PASSWORD:?MYSQL_PASSWORD fehlt}@database:3306/${MYSQL_DATABASE:-hub}?serverVersion=8.4.13&charset=utf8mb4
    MESSENGER_TRANSPORT_DSN: doctrine://default?auto_setup=0
    # Pflicht, auch wenn BetAI nicht genutzt wird: GeminiService liest den Schlüssel beim Erzeugen.
    GEMINI_API_KEY: ${GEMINI_API_KEY:?GEMINI_API_KEY fehlt}
    SENTRY_DSN: ${SENTRY_DSN:-}
    # Mailversand (Secret, da Zugangsdaten enthalten sein können). null://null = keine Mails.
    MAILER_DSN: ${MAILER_DSN:-null://null}
    # Anfragen kommen vom Caddy im Dienst web (Docker-Netz) bzw. dahinter vom VPS – beides private Adressen.
    # Damit erkennt Symfony https und die echte Gast-IP (X-Forwarded-*, von web gesetzt bzw. geprüft).
    SYMFONY_TRUSTED_PROXIES: private_ranges
    SYMFONY_TRUSTED_HEADERS: x-forwarded-for,x-forwarded-proto,x-forwarded-host,x-forwarded-port

services:
  # Einmalig bei jedem Deploy: Datenbank migrieren. Beendet sich mit 0; in Komodo unter ignore_services.
  # Schlägt migrate fehl, startet app nicht (Seite unten bis zum Rollback, docs/deployment.md).
  migrate:
    <<: *app
    restart: "no"
    command: ["php", "bin/console", "doctrine:migrations:migrate", "--no-interaction", "--allow-no-migration"]
    depends_on:
      database:
        condition: service_healthy

  app:
    <<: *app
    depends_on:
      database:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "SCRIPT_NAME=/fpm-ping SCRIPT_FILENAME=/fpm-ping REQUEST_METHOD=GET cgi-fcgi -bind -connect 127.0.0.1:9000 || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 20s

  web:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
      target: web
    image: hub-web:prod
    pull_policy: build
    restart: unless-stopped
    logging: *logging
    environment:
      # Nur HTTP: HTTPS und Zertifikat macht der Caddy auf dem VPS, der über WireGuard hierher weiterleitet.
      SERVER_NAME: ":80"
      # Nur von diesen Adressen gelten X-Forwarded-* (Gast-IP, https): die WireGuard-IP des VPS.
      REVERSE_PROXY_IPS: ${REVERSE_PROXY_IPS:-private_ranges}
    volumes:
      - media_data:/srv/app/public/assets/bet_ai/logos:ro
      - caddy_data:/data
      - caddy_config:/config
    ports:
      # Der einzige Port nach außen, nur auf der WireGuard-Adresse dieses Rechners (HTTP_BIND).
      - "${HTTP_BIND:?HTTP_BIND fehlt}:${HTTP_PORT:?HTTP_PORT fehlt}:80"
    # Prüft den ganzen Weg, den auch der VPS nimmt: Caddy → PHP → Datenbank.
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    depends_on:
      app:
        condition: service_healthy

  database:
    image: mysql:8.4.13
    restart: unless-stopped
    logging: *logging
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-hub}
      MYSQL_USER: ${MYSQL_USER:-hub}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD fehlt}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD fehlt}
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s
    volumes:
      - database_data:/var/lib/mysql:rw

  # Datenbank-Dump nach BACKUP_DIR (Standard /srv/hub/backups auf dem Host), mit Rotation (deploy/komodo/db-backup.sh).
  # Startet nie von selbst (Profil), nur per `docker compose run --rm backup <anlass>`: vor jedem Deploy
  # (pre-deploy.sh, Anlass pre-deploy), täglich über die Komodo-Procedure hub-backup (Anlass daily), oder von Hand.
  backup:
    image: mysql:8.4.13
    profiles: ["backup"]
    restart: "no"
    logging: *logging
    entrypoint: ["sh", "/usr/local/bin/hub-db-backup"]
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-hub}
      MYSQL_PWD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD fehlt}
      BACKUP_KEEP: ${BACKUP_KEEP:-14}
    volumes:
      - ./deploy/komodo/db-backup.sh:/usr/local/bin/hub-db-backup:ro
      # Der Ordner muss auf dem Host schon existieren (einmalig anlegen, docs/deployment.md). Docker legt ihn
      # so nicht still neu an – ein Tippfehler in BACKUP_DIR lässt die Sicherung scheitern statt ins Leere zu gehen.
      - type: bind
        source: ${BACKUP_DIR:-/srv/hub/backups}
        target: /backups
        bind:
          create_host_path: false
    depends_on:
      database:
        condition: service_healthy

# Feste Namen, damit die Daten nicht am Projektnamen hängen. Niemals umbenennen.
# VOLUME_PREFIX nur für Probeläufe setzen (z. B. hubprobe): Die Entwicklungsumgebung im Ordner hub legt ebenfalls
# hub_database_data an – ohne Präfix würde ein Probelauf (und dessen `down -v`) die Dev-Daten treffen.
volumes:
  database_data:
    name: ${VOLUME_PREFIX:-hub}_database_data
  media_data:
    name: ${VOLUME_PREFIX:-hub}_media_data
  caddy_data:
    name: ${VOLUME_PREFIX:-hub}_caddy_data
  caddy_config:
    name: ${VOLUME_PREFIX:-hub}_caddy_config
